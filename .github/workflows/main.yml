name: Build and upload blogdown site to GitHub

on:
  push:
    branches:
      - source  # where the blog posts source files are written

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # Helpful for blogdown/hugo to determine modified dates

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          install-pandoc: true
        
      - name: Install Hugo
        run: Rscript -e "blogdown::install_hugo('0.79.1')"
        
      - name: Render site
        run: Rscript -e "blogdown::build_site()"
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # Updated to v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master # Your deployment target
          cname: selbydavid.com

      - name: R session info (Optional Debug)
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, 'Package']
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
